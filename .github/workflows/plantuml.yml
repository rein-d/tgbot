# Положите файл в репозиторий по пути .github/workflows/plantuml.yml
name: PlantUML Diagrams

on:
  push:
    branches: [main]
    paths: ['diagrams/**/*.puml']

permissions:
  contents: write

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      # НЕ apt-get install plantuml: там версия 2020 года, C4 на ней не собирается
      - name: Download PlantUML
        run: curl -sSL -o plantuml.jar https://github.com/plantuml/plantuml/releases/download/v1.2026.8/plantuml-1.2026.8.jar

      - name: Generate Diagrams
        run: java -jar plantuml.jar -failfast2 "diagrams/**/*.puml"

      - name: Commit Diagrams
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add diagrams
          git diff --cached --quiet || (git commit -m "Automated diagram generation" && git push)