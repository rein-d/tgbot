variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  MAVEN_OPTS: "-Dmaven.repo.local=/.m2/repository"

stages:
  - build
  - deploy

.build-template: &build-template
  stage: build
  tags:
    - docker
  image: docker:24.0.7
  services:
    - docker:24.0.7-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker buildx create --use
    - >
      docker buildx build
      --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}/cache:${CI_COMMIT_REF_SLUG},mode=max
      --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}/cache:${CI_COMMIT_REF_SLUG}
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
      --push
      .
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .m2/repository

build-mr:
  <<: *build-template
  except:
    - main

build-main:
  <<: *build-template
  only:
    - main
  script:
    - docker buildx create --use
    - >
      docker buildx build
      --cache-to type=registry,ref=${CI_REGISTRY_IMAGE}/cache:${CI_COMMIT_REF_SLUG},mode=max
      --cache-from type=registry,ref=${CI_REGISTRY_IMAGE}/cache:${CI_COMMIT_REF_SLUG}
      --build-arg BUILDKIT_INLINE_CACHE=1
      --tag ${CI_REGISTRY_IMAGE}:latest
      --tag ${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}
      --push
      .

deploy:
  stage: deploy
  image: docker:24.0.7
  tags:
    - docker
  variables:
    DOCKER_HOST: "ssh://${SERVER_USER}@${SERVER_HOST}"
  before_script:
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - eval $(ssh-agent -s)
    - echo "${SSH_PRIVATE_KEY}" | tr -d '\r' | ssh-add -
    - '[[ -f /.dockerenv ]] && echo -e "Host *\n\tStrictHostKeyChecking no\n\n" > ~/.ssh/config'
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker compose down --timeout=60 --remove-orphans
    - docker compose pull
    - docker compose up -d
    - docker image prune -af
  only:
    - main