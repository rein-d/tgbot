services:
  client-backend:
    image: client:0.0.1
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    depends_on:
      - service-db
    environment:
      - SERVER_PORT= 9000
      - SPRING_DATASOURCE_URL=jdbc:postgresql://service-db/bot_db

  service-db:
    image: postgres:16.3-alpine3.20
    environment:
      POSTGRES_USER: svetlolikiy
      POSTGRES_PASSWORD: QwAs482@
      POSTGRES_DB: bot_db
    ports:
      - "15432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db-data: